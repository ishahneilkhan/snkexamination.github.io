<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard | SNK AI Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#667085;
    --primary:#5a8a00;
    --primary-dark:#446b00;
    --soft:#f1ffdd;
    --border:#e5e7eb;
    --shadow:0 10px 30px rgba(15,23,42,.07);
}

body.dark{
    --bg:#050505;
    --card:#141414;
    --text:#ffffff;
    --muted:#999999;
    --primary:#b7ff00;
    --primary-dark:#ccff4d;
    --soft:#1c1c1c;
    --border:rgba(183,255,0,.14);
    --shadow:0 10px 30px rgba(0,0,0,.5);
}

body{
    font-family:"Noto Sans Bengali",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.2s;
}

a{ color:inherit; text-decoration:none; }
button{ cursor:pointer; font:inherit; }

/* ===== HEADER ===== */
header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:100;
}

.navbar{
    max-width:1000px;
    margin:0 auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-badge{
    width:40px;
    height:40px;
    border-radius:11px;
    background:#b7ff00;
    color:#050505;
    font-weight:900;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.logo-text{
    font-size:14px;
    font-weight:800;
    line-height:1.3;
}

.logo-text small{
    display:block;
    color:var(--muted);
    font-size:10px;
    font-weight:500;
}

.nav-actions{
    display:flex;
    gap:8px;
}

.nav-btn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    height:38px;
    padding:0 13px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
}

.logout-btn{
    background:#fee2e2;
    border-color:#fecaca;
    color:#b91c1c;
}
body.dark .logout-btn{
    background:rgba(255,69,69,.12);
    border-color:rgba(255,69,69,.3);
    color:#ff8a8a;
}

/* ===== MAIN ===== */
.page{
    max-width:1000px;
    margin:0 auto;
    padding:24px 20px 60px;
}

/* ===== WELCOME ===== */
.welcome{
    background:linear-gradient(135deg,var(--primary),#3d6600);
    border-radius:20px;
    padding:26px;
    color:#050505;
    margin-bottom:22px;
}
body.dark .welcome{
    background:linear-gradient(135deg,var(--primary),#6b9e00);
}

.welcome-greeting{
    font-size:12px;
    font-weight:700;
    opacity:.8;
    margin-bottom:6px;
}

.welcome h1{
    font-size:22px;
    margin-bottom:4px;
}

.welcome-meta{
    font-size:12px;
    font-weight:600;
    opacity:.85;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:10px;
}

.welcome-meta span{
    background:rgba(5,5,5,.12);
    padding:5px 11px;
    border-radius:999px;
}

/* ===== QUICK ACCESS GRID ===== */
.section-label{
    font-size:12px;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin:26px 0 12px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.tile{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 14px;
    text-align:center;
    box-shadow:var(--shadow);
    transition:.2s;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
}

.tile:hover{
    transform:translateY(-3px);
    border-color:var(--primary);
}

.tile-icon{
    width:48px;
    height:48px;
    border-radius:13px;
    background:var(--soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.tile-label{
    font-size:12.5px;
    font-weight:700;
}

/* ===== FOOTER ===== */
.footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:30px 0 10px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:640px){
    .grid{ grid-template-columns:repeat(2,1fr); }
    .navbar{ padding:12px 14px; }
    .page{ padding:18px 14px 50px; }
    .logo-text small{ display:none; }
}

</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#050505">
<script src="site-shell.js" defer></script>
</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header>

<nav class="navbar">

<a href="index.html" class="logo">
    <div class="logo-badge">SNK</div>
    <div class="logo-text">
        SNK AI Academy
        <small>Student Portal</small>
    </div>
</a>


<div class="nav-actions">
    <button class="nav-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    <button class="nav-btn logout-btn" onclick="logoutStudent()">Logout</button>
</div>

</nav>

</header>



<!-- ========================================
     MAIN
======================================== -->

<main class="page">

<!-- ===== WELCOME ===== -->
<section class="welcome">
    <div class="welcome-greeting" id="greetingText">স্বাগতম</div>
    <h1 id="studentName">Student</h1>
    <div class="welcome-meta">
        <span>🆔 <span id="studentId">SNK-1001</span></span>
        <span id="courseMetaWrap" style="display:none;">📚 <span id="studentCourseMeta"></span></span>
    </div>
</section>

<!-- ===== QUICK ACCESS ===== -->
<div class="section-label">Quick Access</div>

<div class="grid">

    <a class="tile" href="student-schedule.html">
        <div class="tile-icon">⏰</div>
        <div class="tile-label">Exam Time</div>
    </a>

    <a class="tile" href="courses.html">
        <div class="tile-icon">📚</div>
        <div class="tile-label">My Course</div>
    </a>

    <a class="tile" href="assignments.html">
        <div class="tile-icon">📝</div>
        <div class="tile-label">Assignments</div>
    </a>

    <a class="tile" href="quiz.html">
        <div class="tile-icon">❓</div>
        <div class="tile-label">Quiz</div>
    </a>

    <a class="tile" href="results.html">
        <div class="tile-icon">🏆</div>
        <div class="tile-label">Results</div>
    </a>

    <a class="tile" href="student-attendance.html">
        <div class="tile-icon">✅</div>
        <div class="tile-label">Attendance</div>
    </a>

    <a class="tile" href="student-resources.html">
        <div class="tile-icon">📁</div>
        <div class="tile-label">Resources</div>
    </a>

    <a class="tile" href="student-notifications.html">
        <div class="tile-icon">🔔</div>
        <div class="tile-label">Notifications</div>
    </a>

    <a class="tile" href="student-profiles.html">
        <div class="tile-icon">👤</div>
        <div class="tile-label">Profile</div>
    </a>

    <a class="tile" href="student-support.html">
        <div class="tile-icon">🆘</div>
        <div class="tile-label">Support</div>
    </a>

</div>

<div class="footer">
    SNK AI Academy • Student Portal
</div>

</main>


<script>
"use strict";

/* =====================================================
   LOAD STUDENT SESSION
===================================================== */
function loadStudentSession(){

    const studentId =
        sessionStorage.getItem("snkStudentId") || "SNK-1001";

    const studentName =
        sessionStorage.getItem("snkStudentName") || "Student";

    const studentCourse =
        sessionStorage.getItem("snkStudentCourse") || "";

    document.getElementById("studentId").textContent = studentId;
    document.getElementById("studentName").textContent = studentName;

    if(studentCourse){
        document.getElementById("studentCourseMeta").textContent = studentCourse;
        document.getElementById("courseMetaWrap").style.display = "inline-block";
    }

    const hour = new Date().getHours();
    let greeting = "শুভ সকাল";
    if(hour >= 12 && hour < 17) greeting = "শুভ বিকাল";
    else if(hour >= 17) greeting = "শুভ সন্ধ্যা";
    document.getElementById("greetingText").textContent = greeting;
}


/* =====================================================
   LOGOUT
===================================================== */
function logoutStudent(){

    const confirmLogout =
        confirm("আপনি কি Student Portal থেকে Logout করতে চান?");

    if(!confirmLogout) return;

    sessionStorage.removeItem("snkStudentLoggedIn");
    sessionStorage.removeItem("snkStudentId");
    sessionStorage.removeItem("snkStudentName");
    sessionStorage.removeItem("snkStudentCourse");

    window.location.replace("login.html");
}


/* =====================================================
   THEME
===================================================== */
function toggleTheme(){
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("snkTheme", isDark ? "dark" : "light");
    document.getElementById("themeBtn").textContent = isDark ? "☀️" : "🌙";
}

(function(){
    const savedTheme = localStorage.getItem("snkTheme");
    if(savedTheme === "dark"){
        document.body.classList.add("dark");
        document.getElementById("themeBtn").textContent = "☀️";
    }
})();


/* =====================================================
   SESSION GUARD
===================================================== */
(function guardStudentSession(){
    const loggedIn = sessionStorage.getItem("snkStudentLoggedIn");
    if(loggedIn !== "true"){
        window.location.replace("login.html");
    }
})();


loadStudentSession();
</script>

</body>
</html>
