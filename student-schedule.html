<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>পরীক্ষার সময় | SNK AI Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans Bengali",Arial,sans-serif;background:#050505;color:#fff;min-height:100vh;
  background-image:radial-gradient(circle at 10% 0%,rgba(183,255,0,.12),transparent 35%)}
body.light{background:#f5f7fb;color:#172033}
a{color:inherit;text-decoration:none}
.bar{display:flex;align-items:center;gap:12px;padding:14px;position:sticky;top:0;z-index:50;background:rgba(5,5,5,.92);border-bottom:1px solid rgba(183,255,0,.18);backdrop-filter:blur(12px)}
body.light .bar{background:rgba(255,255,255,.95)}
.back{width:48px;height:48px;border-radius:16px;background:#b7ff00;color:#050505;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ttl{font-size:20px;font-weight:800;line-height:1.2}
.ttl small{display:block;font-size:12px;font-weight:600;color:#999}
.sp{flex:1}
.hello{max-width:1100px;margin:18px auto 0;padding:0 14px;font-size:17px;color:#cfcfcf;line-height:1.7}
body.light .hello{color:#445}
.hello b{color:#b7ff00}
body.light .hello b{color:#5a8a00}
.snk-box{max-width:1100px;margin:14px auto}
#snkSchedulePage{max-width:1100px;margin:14px auto 60px;padding:0 14px}
.legend{max-width:1100px;margin:0 auto;padding:0 14px;display:flex;gap:8px;flex-wrap:wrap}
.legend span{padding:8px 13px;border-radius:999px;background:#141414;border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:700}
body.light .legend span{background:#fff;border-color:#dde}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<div class="bar">
  <a class="back" href="student-dashboard.html" aria-label="পেছনে">←</a>
  <div class="ttl">⏰ পরীক্ষার সময়<small>SNK AI Academy</small></div>
  <div class="sp"></div>
</div>

<div class="hello">👋 <b id="who">তুমি</b>, নিচে দেখো কখন <b>পরীক্ষা</b>, <b>কুইজ</b> আর <b>অ্যাসাইনমেন্ট</b> আছে। সময় শেষ হওয়ার আগেই করে ফেলো!</div>
<div class="legend" style="margin-top:12px"><span>📝 পরীক্ষা</span><span>🧠 কুইজ</span><span>📚 অ্যাসাইনমেন্ট</span></div>

<div id="snkSchedulePage"></div>

<script>
(function(){
  try{
    if(localStorage.getItem("snkTheme")==="light") document.body.classList.add("light");
    var n=sessionStorage.getItem("snkStudentName");
    if(n) document.getElementById("who").textContent=n;
  }catch(e){}
})();
</script>
<script src="site-shell.js" defer></script>
</body>
</html>
